[project]
name = "ai-customer-operations"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.0.0",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.141.1",
    "langgraph>=1.2.11",
